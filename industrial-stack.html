<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工业生产百科全书 · 从农业社会到现代化</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Songti SC', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'PingFang SC', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · 工业生产百科</p>
    <h1>从农业社会到现代化 · 六层工业能力栈</h1>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="industrial-stack-title industrial-stack-desc">
      <title id="industrial-stack-title">从农业社会到现代化 · 六层工业能力栈</title>
      <desc id="industrial-stack-desc">层叠图展示一个农业社会迈向现代化所需的六层工业生产能力，从底层资源采掘到顶层现代社会，动力与机床工业为关键转折层。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Direction column (left margin) -->
      <text x="60" y="68" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'PingFang SC', monospace" letter-spacing="0.18em">现代化</text>
      <line x1="80" y1="80" x2="80" y2="464" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <polygon points="76,80 84,80 80,72" fill="#4f5d75"/>
      <text x="56" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'PingFang SC', monospace" letter-spacing="0.18em">农业社会</text>

      <!-- Stack container hairlines (top + bottom edges) -->
      <line x1="120" y1="80" x2="960" y2="80" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="120" y1="464" x2="960" y2="464" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- L6 — 现代化社会 (top, white fill) -->
      <rect x="120" y="80" width="840" height="64" fill="#ffffff"/>
      <line x1="120" y1="144" x2="960" y2="144" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'PingFang SC', monospace" letter-spacing="0.14em">L6</text>
      <text x="200" y="118" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">现代化社会</text>
      <text x="940" y="118" fill="#4f5d75" font-size="10" font-family="'Geist Mono', 'PingFang SC', monospace" text-anchor="end" letter-spacing="0.08em">服务经济 · 科技创新 · 品质生活</text>

      <!-- L5 — 电子信息工业 -->
      <rect x="120" y="144" width="840" height="64" fill="#ececec"/>
      <line x1="120" y1="208" x2="960" y2="208" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'PingFang SC', monospace" letter-spacing="0.14em">L5</text>
      <text x="200" y="182" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">电子信息工业</text>
      <text x="940" y="182" fill="#4f5d75" font-size="10" font-family="'Geist Mono', 'PingFang SC', monospace" text-anchor="end" letter-spacing="0.08em">半导体 · 计算机 · 通信网络</text>

      <!-- L4 — 装备制造工业 -->
      <rect x="120" y="208" width="840" height="64" fill="#ffffff"/>
      <line x1="120" y1="272" x2="960" y2="272" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'PingFang SC', monospace" letter-spacing="0.14em">L4</text>
      <text x="200" y="246" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">装备制造工业</text>
      <text x="940" y="246" fill="#4f5d75" font-size="10" font-family="'Geist Mono', 'PingFang SC', monospace" text-anchor="end" letter-spacing="0.08em">铁路船舶 · 汽车 · 农机 · 工业设备</text>

      <!-- L3 — 动力与机床工业 (FOCAL, coral tint + coral stroke) -->
      <rect x="120" y="272" width="840" height="64" fill="rgba(235,108,54,0.08)"/>
      <rect x="120" y="272" width="840" height="64" fill="none" stroke="#eb6c36" stroke-width="1"/>
      <text x="140" y="308" fill="#eb6c36" font-size="8" font-family="'Geist Mono', 'PingFang SC', monospace" letter-spacing="0.14em" font-weight="600">L3</text>
      <text x="200" y="310" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">动力与机床工业</text>
      <text x="940" y="310" fill="#eb6c36" font-size="10" font-family="'Geist Mono', 'PingFang SC', monospace" text-anchor="end" letter-spacing="0.08em">蒸汽机 · 内燃机 · 电机 · 机床</text>

      <!-- L2 — 基础材料工业 -->
      <rect x="120" y="336" width="840" height="64" fill="#ececec"/>
      <line x1="120" y1="400" x2="960" y2="400" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="140" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'PingFang SC', monospace" letter-spacing="0.14em">L2</text>
      <text x="200" y="374" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">基础材料工业</text>
      <text x="940" y="374" fill="#4f5d75" font-size="10" font-family="'Geist Mono', 'PingFang SC', monospace" text-anchor="end" letter-spacing="0.08em">钢铁冶金 · 水泥建材 · 基础化工</text>

      <!-- L1 — 资源采掘工业 (bottom) -->
      <rect x="120" y="400" width="840" height="64" fill="#ffffff"/>
      <text x="140" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'PingFang SC', monospace" letter-spacing="0.14em">L1</text>
      <text x="200" y="438" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">资源采掘工业</text>
      <text x="940" y="438" fill="#4f5d75" font-size="10" font-family="'Geist Mono', 'PingFang SC', monospace" text-anchor="end" letter-spacing="0.08em">矿产 · 煤炭 · 油气 · 水力</text>

      <!-- Caption -->
      <text x="120" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', 'PingFang SC', monospace" letter-spacing="0.18em">关键转折层</text>
      <text x="240" y="508" fill="#4f5d75" font-size="9" font-family="'Geist', 'PingFang SC', sans-serif" font-style="italic">动力与机床是"制造机器的机器"——掌握它，一个国家才能自主复制和升级工业体系，而非永远依赖进口。</text>
    </svg>
  </div>
</body>
</html>
