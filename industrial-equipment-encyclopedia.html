<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工业生产百科全书 · 设备图鉴</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #1a2332;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(26,35,50,0.12);
      --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,0.08);
      --link: #1a4ed8;
      --link-dark: #1e3a8a;
      --white: #ffffff;
      --font-sans: 'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono: 'Geist Mono', 'Noto Sans SC', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    /* === Layout === */
    .app { display: flex; min-height: 100vh; }

    /* === Sidebar === */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: var(--white);
      border-right: 1px solid var(--rule);
      padding: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .sidebar-title {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      padding: 1.5rem 1.5rem 1rem;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 0.5rem;
    }

    .sidebar-export {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--rule);
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .export-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: var(--white);
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
    }
    .export-btn:hover {
      background: var(--accent-tint);
      border-color: var(--accent);
      color: var(--accent);
    }
    .export-btn svg { width: 15px; height: 15px; color: var(--muted); flex-shrink: 0; }
    .export-btn:hover svg { color: var(--accent); }

    .db-status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--soft);
      letter-spacing: 0.06em;
      background: var(--paper);
      border-radius: 6px;
      border: 1px solid var(--rule);
    }
    .db-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }
    .db-dot.loaded { background: var(--accent); }
    .db-dot.error { background: #ef4444; }

    .layer-nav { list-style: none; }
    .layer-nav li {
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      transition: all 0.15s;
      border-left: 3px solid transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .layer-nav li:hover { background: var(--paper); }
    .layer-nav li.active {
      background: var(--accent-tint);
      border-left-color: var(--accent);
    }
    .layer-nav li.active .layer-nav-tag { color: var(--accent); }
    .layer-nav li.active .layer-nav-name { color: var(--ink); font-weight: 600; }

    .layer-nav-tag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--soft);
      letter-spacing: 0.1em;
      width: 28px;
    }
    .layer-nav-name {
      font-size: 0.88rem;
      color: var(--muted);
    }
    .layer-nav-count {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--soft);
    }

    /* === Main === */
    .main {
      flex: 1;
      padding: 2rem 2.5rem 4rem;
      min-width: 0;
    }

    .main-header { margin-bottom: 2rem; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }
    .main-desc {
      font-size: 0.92rem;
      color: var(--muted);
      max-width: 600px;
      line-height: 1.5;
    }

    /* === Subcategory === */
    .subcategory { margin-bottom: 2rem; }
    .subcategory-title {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--soft);
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--rule);
    }

    /* === Equipment Grid === */
    .equip-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }

    .equip-item {
      display: flex;
      align-items: center;
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.15s;
    }
    .equip-item:hover {
      border-color: rgba(26,78,216,0.3);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .equip-copy {
      width: 40px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: var(--paper);
      border-right: 1px solid var(--rule);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .equip-copy:hover { background: var(--accent-tint); }
    .equip-copy.copied { background: var(--accent); }
    .equip-copy svg { width: 15px; height: 15px; color: var(--muted); transition: all 0.15s; }
    .equip-copy:hover svg { color: var(--accent); }
    .equip-copy.copied svg { color: var(--white); }

    .equip-name {
      flex: 1;
      padding: 0 14px;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--link-dark);
      cursor: pointer;
      line-height: 1.3;
      transition: color 0.15s;
    }
    .equip-name:hover { color: var(--link); text-decoration: underline; }

    .equip-detail-badge {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      color: var(--accent);
      margin-right: 10px;
      flex-shrink: 0;
      letter-spacing: 0.06em;
    }

    /* === Detail Panel === */
    .detail-overlay {
      display: none;
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: min(720px, 100%);
      background: var(--white);
      box-shadow: -8px 0 32px rgba(0,0,0,0.12);
      z-index: 1000;
      overflow-y: auto;
      animation: slideIn 0.3s ease;
    }
    .detail-overlay.open { display: block; }

    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    .detail-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 999;
    }
    .detail-backdrop.open { display: block; }

    .detail-header {
      padding: 1.5rem 2rem 1rem;
      border-bottom: 1px solid var(--rule);
      position: sticky;
      top: 0;
      background: var(--white);
      z-index: 10;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .detail-header-left { flex: 1; }
    .detail-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--soft);
      margin-bottom: 0.3rem;
    }
    .detail-title {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 400;
      line-height: 1.2;
    }

    .detail-close {
      width: 36px;
      height: 36px;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: var(--white);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-left: 1rem;
      transition: all 0.15s;
    }
    .detail-close:hover { background: var(--paper); }
    .detail-close svg { width: 16px; height: 16px; color: var(--muted); }

    .detail-body { padding: 1.5rem 2rem 3rem; }

    /* === Detail Sections === */
    .detail-section { margin-bottom: 2.5rem; }
    .detail-section-title {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--ink);
    }

    /* === Supplier Table === */
    .supplier-list { display: flex; flex-direction: column; gap: 10px; }
    .supplier-card {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 8px;
      gap: 16px;
    }
    .supplier-rank {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      color: var(--soft);
      width: 32px;
      flex-shrink: 0;
    }
    .supplier-card:nth-child(1) .supplier-rank { color: var(--accent); }
    .supplier-info { flex: 1; }
    .supplier-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 2px;
    }
    .supplier-desc {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .supplier-share {
      text-align: right;
      flex-shrink: 0;
    }
    .supplier-share-num {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--ink);
    }
    .supplier-share-label {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      color: var(--soft);
      letter-spacing: 0.1em;
    }

    /* === Production Steps === */
    .prod-steps { display: flex; flex-direction: column; gap: 0; }
    .prod-step {
      display: flex;
      gap: 16px;
      padding-bottom: 20px;
      position: relative;
    }
    .prod-step:not(:last-child)::before {
      content: '';
      position: absolute;
      left: 15px;
      top: 32px;
      bottom: 0;
      width: 2px;
      background: var(--rule);
    }
    .prod-step-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      flex-shrink: 0;
      z-index: 1;
    }
    .prod-step-content { flex: 1; padding-top: 4px; }
    .prod-step-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 4px;
    }
    .prod-step-desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
    }

    /* === Parts Grid === */
    .parts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    .parts-group h4 {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--soft);
      margin-bottom: 8px;
    }
    .parts-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .part-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--link-dark);
      cursor: pointer;
      transition: all 0.15s;
    }
    .part-chip:hover {
      background: rgba(26,78,216,0.08);
      border-color: rgba(26,78,216,0.3);
      color: var(--link);
    }
    .part-chip.copied {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--white);
    }
    .part-chip svg { width: 11px; height: 11px; opacity: 0.5; }
    .part-chip:hover svg { opacity: 0.8; }
    .part-chip.copied svg { opacity: 1; }

    /* === Video Cards === */
    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .video-card {
      border: 1px solid var(--rule);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .video-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      border-color: rgba(235,108,54,0.3);
    }
    .video-thumb {
      position: relative;
      aspect-ratio: 16/9;
      overflow: hidden;
      background: #1a2332;
    }
    .video-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .video-card:hover .video-thumb img { transform: scale(1.05); }
    .video-thumb-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .video-thumb-text {
      color: rgba(255,255,255,0.92);
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      line-height: 1.4;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
      max-width: 90%;
      word-break: break-word;
      pointer-events: none;
    }
    .video-play {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 48px; height: 48px;
      background: rgba(0,0,0,0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .video-card:hover .video-play {
      background: var(--accent);
      width: 52px; height: 52px;
    }
    .video-play svg { width: 18px; height: 18px; color: white; margin-left: 2px; }
    .video-source {
      position: absolute;
      top: 10px; right: 10px;
      padding: 3px 8px;
      background: rgba(0,0,0,0.7);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      color: white;
      letter-spacing: 0.06em;
    }
    .video-info { padding: 12px 14px; }
    .video-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.4;
      margin-bottom: 4px;
    }
    .video-meta {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--soft);
    }

    /* === Toast === */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--ink);
      color: var(--white);
      padding: 10px 20px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* === Prompt Popover === */
    .prompt-btn { color: var(--accent); }
    .prompt-btn:hover { background: rgba(37,99,235,0.06); }

    .popover-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .popover-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .prompt-popover {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      width: 640px;
      max-width: 92vw;
      max-height: 85vh;
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.04);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .prompt-popover.show {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .popover-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--rule);
      flex-shrink: 0;
    }
    .popover-title {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }
    .popover-close {
      background: none;
      border: none;
      color: var(--soft);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.15s ease;
    }
    .popover-close:hover {
      color: var(--ink);
      background: var(--paper);
    }
    .popover-close svg {
      width: 16px;
      height: 16px;
    }

    .popover-body {
      padding: 1rem 1.25rem;
      overflow-y: auto;
      flex: 1;
    }
    .popover-hint {
      font-size: 0.82rem;
      color: var(--soft);
      margin: 0 0 0.75rem;
      line-height: 1.5;
    }
    .prompt-text {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      line-height: 1.65;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 50vh;
      overflow-y: auto;
    }

    .popover-footer {
      padding: 0.85rem 1.25rem;
      border-top: 1px solid var(--rule);
      flex-shrink: 0;
      display: flex;
      justify-content: flex-end;
    }
    .popover-copy {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .popover-copy:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
    .popover-copy svg {
      width: 15px;
      height: 15px;
    }
    .popover-copy.copied {
      background: #22c55e;
    }

    /* === Responsive === */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { padding: 1.5rem 1rem 3rem; }
      .parts-grid { grid-template-columns: 1fr; }
      .video-grid { grid-template-columns: 1fr; }
      .detail-overlay { width: 100%; }
      .detail-body { padding: 1rem 1.25rem 2rem; }
      .detail-header { padding: 1rem 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-title">工业生产百科</div>
      <ul class="layer-nav" id="layerNav"></ul>
      <div class="sidebar-export">
        <div class="db-status" id="dbStatus">
          <span class="db-dot"></span>
          <span id="dbStatusText">默认数据</span>
        </div>
        <button class="export-btn" id="switchDbBtn" title="选择 JSON 数据文件加载">
          <svg viewBox="0 0 16 16" fill="none"><path d="M8 2V11M8 11L4 7M8 11L12 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 13H13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          切换数据库
        </button>
        <button class="export-btn" id="exportMdBtn" title="导出为 Markdown 文档">
          <svg viewBox="0 0 16 16" fill="none"><path d="M3 4H7L8 5.5L9 4H13V12H3V4Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M7 4V12M9 4V12" stroke="currentColor" stroke-width="1.3"/></svg>
          导出 Markdown
        </button>
        <button class="export-btn" id="exportJsonBtn" title="导出为 JSON 数据文件">

        sec.appendChild(list);
        detailBody.appendChild(sec);
      }

      // --- Production ---
      if (data.production) {
        const sec = document.createElement('div');
        sec.className = 'detail-section';
        sec.innerHTML = '<p class="detail-section-title">生产流程</p>';
        const steps = document.createElement('div');
        steps.className = 'prod-steps';
        data.production.forEach((step, i) => {
          const stepDiv = document.createElement('div');
          stepDiv.className = 'prod-step';
          stepDiv.innerHTML = `
            <div class="prod-step-num">${i + 1}</div>
            <div class="prod-step-content">
              <div class="prod-step-title">${step.title}</div>
              <div class="prod-step-desc">${step.desc}</div>
            </div>
          `;
          steps.appendChild(stepDiv);
        });
        sec.appendChild(steps);
        detailBody.appendChild(sec);
      }

      // --- Parts ---
      if (data.parts) {
        const sec = document.createElement('div');
        sec.className = 'detail-section';
        sec.innerHTML = '<p class="detail-section-title">零部件与关键技术</p>';
        const grid = document.createElement('div');
        grid.className = 'parts-grid';
        data.parts.forEach(group => {
          const groupDiv = document.createElement('div');
          groupDiv.className = 'parts-group';
          groupDiv.innerHTML = `<h4>${group.group}</h4>`;
          const chipList = document.createElement('div');
          chipList.className = 'parts-list';
          group.items.forEach(item => {
            const chip = document.createElement('button');
            chip.className = 'part-chip';
            chip.innerHTML = `${partCopyIcon}<span>${item}</span>`;
            chip.addEventListener('click', (e) => {
              e.stopPropagation();
              copyText(item, chip);
            });
            chipList.appendChild(chip);
          });
          groupDiv.appendChild(chipList);
          grid.appendChild(groupDiv);
        });
        sec.appendChild(grid);
        detailBody.appendChild(sec);
      }

      // --- Videos ---
      if (data.videos) {
        const sec = document.createElement('div');
        sec.className = 'detail-section';
        sec.innerHTML = '<p class="detail-section-title">参考视频</p>';
        const grid = document.createElement('div');
        grid.className = 'video-grid';
        data.videos.forEach(v => {
          const card = document.createElement('a');
          card.className = 'video-card';
          card.href = v.url;
          card.target = '_blank';
          card.rel = 'noopener';
          const hasImg = v.img && v.img.trim();
          const gradients = {
            'Bilibili': 'linear-gradient(135deg, #fb7299, #00a1d6)',
            'CCTV': 'linear-gradient(135deg, #c41e3a, #e8a024)',
            'YouTube': 'linear-gradient(135deg, #ff0000, #cc0000)',
            '抖音': 'linear-gradient(135deg, #25f4ee, #fe2c55)',
            '小红书': 'linear-gradient(135deg, #ff2442, #ff6b6b)'
          };
          if (hasImg) {
            card.innerHTML = `
              <div class="video-thumb">
                <img src="${v.img}" alt="${v.title}" loading="lazy">
                <div class="video-play">${playIcon}</div>
                <span class="video-source">${v.source}</span>
              </div>
              <div class="video-info">
                <div class="video-title">${v.title}</div>
                <div class="video-meta">${v.meta}</div>
              </div>
            `;
          } else {
            const bg = gradients[v.source] || 'linear-gradient(135deg, #3a4a5c, #1a1f2e)';
            card.innerHTML = `
              <div class="video-thumb video-thumb-placeholder" style="background: ${bg}">
                <span class="video-thumb-text">${v.title}</span>
                <div class="video-play">${playIcon}</div>
                <span class="video-source">${v.source}</span>
              </div>
              <div class="video-info">
                <div class="video-title">${v.title}</div>
                <div class="video-meta">${v.meta}</div>
              </div>
            `;
          }
          grid.appendChild(card);
        });
        sec.appendChild(grid);
        detailBody.appendChild(sec);
      }

      overlay.classList.add('open');
      backdrop.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeDetail() {
      overlay.classList.remove('open');
      backdrop.classList.remove('open');
      document.body.style.overflow = '';
    }

    detailClose.addEventListener('click', closeDetail);
    backdrop.addEventListener('click', closeDetail);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.classList.contains('open')) closeDetail();
    });

    // === Copy ===
    function copyText(text, btn) {
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch(e) {}
        document.body.removeChild(ta);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(fallback);
      } else {
        fallback();
      }

      const originalHTML = btn.innerHTML;
      btn.classList.add('copied');
      btn.innerHTML = checkIcon;
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = originalHTML;
      }, 1200);

      showToast(`已复制：${text}`);
    }

    // === Toast ===
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');
    let toastTimer = null;

    function showToast(msg) {
      toastText.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // === Export ===
    function downloadFile(filename, content, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportMarkdown() {
      const now = new Date();
      const dateStr = now.toISOString().slice(0, 10);
      let md = '';
      md += `# 工业生产百科全书 · 设备图鉴数据\n\n`;
      md += `> 导出时间：${dateStr}\n`;
      md += `> 数据用途：供 AI 读取并补充缺失的设备详情信息\n`;
      md += `> 补充格式：在对应设备下方的各字段中填写内容\n\n`;
      md += `---\n\n`;

      let totalItems = 0;
      let detailCount = 0;

      layersData.forEach(layer => {
        totalItems += layer.subcategories.reduce((s, c) => s + c.items.length, 0);
      });
      detailCount = Object.keys(equipmentDetails).length;

      md += `## 数据统计\n\n`;
      md += `- 工业层级：${layersData.length} 层\n`;
      md += `- 设备总数：${totalItems} 项\n`;
      md += `- 已有详情：${detailCount} 项\n`;
      md += `- 待补充：${totalItems - detailCount} 项\n\n`;
      md += `---\n\n`;
      md += `## 补充说明\n\n`;
      md += `每个设备详情包含以下字段，请按此结构补充：\n\n`;
      md += '| 字段 | 说明 |\n';
      md += '|------|------|\n';
      md += '| 供应商 | 中国主要供应商列表，含市场份额 |\n';
      md += '| 生产流程 | 生产步骤列表，含标题和描述 |\n';
      md += '| 零部件 | 按系统分组的零部件清单 |\n';
      md += '| 参考视频 | 相关视频的标题、来源、链接 |\n\n';
      md += `---\n\n`;

      layersData.forEach(layer => {
        md += `## ${layer.id} ${layer.name}\n\n`;
        md += `> ${layer.desc}\n\n`;

        layer.subcategories.forEach(sub => {
          md += `### ${sub.title}\n\n`;

          sub.items.forEach(item => {
            const detail = equipmentDetails[item];
            if (detail) {
              md += `#### [详情已填] ${item}\n\n`;

              // Suppliers
              if (detail.suppliers && detail.suppliers.length > 0) {
                md += `**供应商：**\n\n`;
                md += '| 序号 | 名称 | 描述 | 市场份额 |\n';
                md += '|------|------|------|----------|\n';
                detail.suppliers.forEach(s => {
                  md += `| ${s.rank} | ${s.name} | ${s.desc} | ${s.share} |\n`;
                });
                md += '\n';
              }

              // Production
              if (detail.production && detail.production.length > 0) {
                md += `**生产流程：**\n\n`;
                detail.production.forEach((step, i) => {
                  md += `${i + 1}. **${step.title}** — ${step.desc}\n`;
                });
                md += '\n';
              }

              // Parts
              if (detail.parts && detail.parts.length > 0) {
                md += `**零部件与关键技术：**\n\n`;
                detail.parts.forEach(group => {
                  md += `- ${group.group}：${group.items.join('、')}\n`;
                });
                md += '\n';
              }

              // Videos
              if (detail.videos && detail.videos.length > 0) {
                md += `**参考视频：**\n\n`;
                detail.videos.forEach(v => {
                  md += `- [${v.title}](${v.url}) — ${v.source} · ${v.meta}\n`;
                });
                md += '\n';
              }
            } else {
              md += `#### [待补充] ${item}\n\n`;
              md += `**供应商：**\n> 待补充\n\n`;
              md += `**生产流程：**\n> 待补充\n\n`;
              md += `**零部件与关键技术：**\n> 待补充\n\n`;
              md += `**参考视频：**\n> 待补充\n\n`;
            }
          });
        });
        md += `---\n\n`;
      });

      md += `\n## AI 补充指引\n\n`;
      md += `1. 请在 \`[待补充]\` 标记的设备下方填入对应信息\n`;
      md += `2. 填写后将 \`[待补充]\` 改为 \`[详情已填]\`\n`;
      md += `3. 参考已有详情（如挖掘机）的格式保持一致\n`;
      md += `4. 市场份额数据请引用可公开查证的来源\n`;
      md += `5. 视频链接优先使用 Bilibili 或 YouTube\n`;

      downloadFile(`industrial-equipment-${dateStr}.md`, md, 'text/markdown;charset=utf-8');
      showToast(`已导出 Markdown：${totalItems} 项设备，${detailCount} 项已有详情`);
    }

    function exportJSON() {
      const now = new Date();
      const dateStr = now.toISOString().slice(0, 10);

      const data = {
        meta: {
          title: '工业生产百科全书 · 设备图鉴数据',
          exportDate: dateStr,
          version: '1.0',
          purpose: '供 AI 读取并补充缺失的设备详情信息',
          schema: {
            suppliers: 'Array<{ rank: number, name: string, desc: string, share: string, shareLabel: string }>',
            production: 'Array<{ title: string, desc: string }>',
            parts: 'Array<{ group: string, items: string[] }>',
            videos: 'Array<{ title: string, source: string, meta: string, img: string (留空则用渐变占位), url: string }>'
          },
          stats: {
            totalLayers: layersData.length,
            totalItems: 0,
            withDetails: Object.keys(equipmentDetails).length,
            pendingDetails: 0
          }
        },
        layers: [],
        details: {}
      };

      let total = 0;
      layersData.forEach(layer => {
        const layerData = {
          id: layer.id,
          name: layer.name,
          desc: layer.desc,
          subcategories: []
        };
        layer.subcategories.forEach(sub => {
          layerData.subcategories.push({
            title: sub.title,
            items: sub.items
          });
          total += sub.items.length;
        });
        data.meta.stats.totalItems = total;
        data.layers.push(layerData);
      });
      data.meta.stats.pendingDetails = total - Object.keys(equipmentDetails).length;

      // Deep copy details
      data.details = JSON.parse(JSON.stringify(equipmentDetails));

      // Add template for items without details
      data.template = {
        suppliers: [
          { rank: 1, name: '供应商名称', desc: '描述', share: 'XX%', shareLabel: '市占率' }
        ],
        production: [
          { title: '步骤名称', desc: '步骤描述' }
        ],
        parts: [
          { group: '系统名称', items: ['零部件1', '零部件2'] }
        ],
        videos: [
          { title: '视频标题', source: '平台', meta: '作者 · 日期', img: '', url: 'https://' }
        ]
      };

      const json = JSON.stringify(data, null, 2);
      downloadFile(`industrial-equipment-${dateStr}.json`, json, 'application/json;charset=utf-8');
      showToast(`已导出 JSON：${total} 项设备，${Object.keys(equipmentDetails).length} 项已有详情`);
    }

    document.getElementById('exportMdBtn').addEventListener('click', exportMarkdown);
    document.getElementById('exportJsonBtn').addEventListener('click', exportJSON);

    // === Switch Database ===
    const dbFileInput = document.getElementById('dbFileInput');
    const switchDbBtn = document.getElementById('switchDbBtn');
    const dbStatusText = document.getElementById('dbStatusText');
    const dbDot = document.querySelector('.db-dot');

    switchDbBtn.addEventListener('click', () => dbFileInput.click());

    dbFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          let loadedLayers = null;
          let loadedDetails = null;

          // Support multiple JSON shapes
          if (data.layers && data.details) {
            loadedLayers = data.layers;
            loadedDetails = data.details;
          } else if (Array.isArray(data) && data[0] && data[0].subcategories) {
            loadedLayers = data;
            loadedDetails = {};
          } else {
            throw new Error('数据格式不匹配');
          }

          // Validate structure
          if (!Array.isArray(loadedLayers) || loadedLayers.length === 0) {
            throw new Error('层数据为空');
          }

          // Replace data
          layersData.length = 0;
          loadedLayers.forEach(l => layersData.push(l));

          if (loadedDetails && typeof loadedDetails === 'object') {
            Object.keys(equipmentDetails).forEach(k => delete equipmentDetails[k]);
            Object.keys(loadedDetails).forEach(k => { equipmentDetails[k] = loadedDetails[k]; });
          }

          // Re-render sidebar
          const nav = document.getElementById('layerNav');
          nav.innerHTML = '';
          layersData.forEach((layer, idx) => {
            const count = layer.subcategories.reduce((sum, s) => sum + s.items.length, 0);
            const li = document.createElement('li');
            li.className = idx === 0 ? 'active' : '';
            li.dataset.layerIdx = idx;
            li.innerHTML = `
              <span class="layer-nav-tag">${layer.id}</span>
              <span class="layer-nav-name">${layer.name}</span>
              <span class="layer-nav-count">${count}</span>
            `;
            li.addEventListener('click', () => selectLayer(idx));
            nav.appendChild(li);
          });

          // Re-render main content
          selectLayer(0);

          // Update status
          const detailCount = Object.keys(equipmentDetails).length;
          const totalItems = layersData.reduce((sum, l) =>
            sum + l.subcategories.reduce((s, c) => s + c.items.length, 0), 0);
          const shortName = file.name.length > 20 ? file.name.slice(0, 18) + '…' : file.name;
          dbStatusText.textContent = `${shortName} · ${detailCount}/${totalItems}详情`;
          dbDot.classList.add('loaded');
          dbDot.classList.remove('error');

          showToast(`已加载数据库：${file.name}（${totalItems}设备，${detailCount}详情）`);
        } catch (err) {
          dbStatusText.textContent = '加载失败';
          dbDot.classList.add('error');
          dbDot.classList.remove('loaded');
          showToast(`加载失败：${err.message}`);
        }
      };
      reader.onerror = () => {
        showToast('文件读取失败');
        dbStatusText.textContent = '读取失败';
        dbDot.classList.add('error');
      };
      reader.readAsText(file);

      // Reset input so the same file can be re-selected
      dbFileInput.value = '';
    });

    // === Init ===
    selectLayer(0);

    // === Prompt Popover ===
    const AI_PROMPT = `你是一个工业设备数据专家。我会给你一个 JSON 文件，请按以下规则补充其中标记为"待补充"的设备详情。

## 数据结构说明

JSON 文件包含以下顶层字段：
- layers: 6 个工业层级数组，每个层级有 subcategories，每个 subcategory 有 items（设备名称列表）
- details: 已有详情的对象，key 为设备名称
- template: 空详情模板，展示每个字段的结构

## 每个设备需要补充的内容

请按 template 的结构为每个待补充设备填写以下字段：

1. suppliers — 中国主要供应商列表
   - name: 企业全称
   - rank: 行业排名或地位描述
   - feature: 核心优势或特色（一句话）
   - share: 市场份额（如有数据则填数字，无则留空字符串）

2. process — 生产流程步骤（数组）
   - step: 步骤名称（如"钢板下料"）
   - desc: 该步骤的简要说明

3. parts — 零部件与关键技术（按分组组织）
   - group: 分组名称（如"动力系统"、"液压系统"）
   - items: 该分组下的零部件名称数组（每个名称都是可点击复制的独立条目）

4. references — 参考视频
   - title: 视频标题
   - source: 来源平台（如 Bilibili、CCTV、YouTube）
   - url: 视频链接
   - img: 封面图 URL（留空字符串则自动用渐变色+标题文字占位，无需生成图片）

## 补充规则

1. 只补充 details 中不存在的设备，已存在的不要修改
2. 每个设备至少补充 3-5 家供应商、6-10 步生产流程、4-6 个零部件分组、2-4 个参考视频
3. 供应商信息要真实准确，排名基于中国市场份额
4. 参考视频链接使用真实可访问的 URL（Bilibili/CCTV /抖音/小红书等）
5. 封面图 img 字段留空即可，页面会自动用渐变色背景+标题文字占位
6. 输出完整的 JSON 文件，保持原有结构不变，只新增 details 中的条目

## 输出格式

请直接输出完整的 JSON 文件，不要用 markdown 代码块包裹，不要加任何解释文字。输出后我可以用"切换数据库"按钮直接导入页面。`;

    document.getElementById('promptText').textContent = AI_PROMPT;

    const promptPopover = document.getElementById('promptPopover');
    const popoverBackdrop = document.getElementById('popoverBackdrop');
    const promptBtn = document.getElementById('promptBtn');
    const popoverClose = document.getElementById('popoverClose');
    const popoverCopy = document.getElementById('popoverCopy');

    function showPopover() {
      promptPopover.classList.add('show');
      popoverBackdrop.classList.add('show');
    }
    function hidePopover() {
      promptPopover.classList.remove('show');
      popoverBackdrop.classList.remove('show');
    }

    promptBtn.addEventListener('click', showPopover);
    popoverClose.addEventListener('click', hidePopover);
    popoverBackdrop.addEventListener('click', hidePopover);

    popoverCopy.addEventListener('click', () => {
      const text = AI_PROMPT;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          popoverCopy.classList.add('copied');
          const orig = popoverCopy.innerHTML;
          popoverCopy.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8L6.5 11.5L13 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> 已复制';
          setTimeout(() => {
            popoverCopy.classList.remove('copied');
            popoverCopy.innerHTML = orig;
          }, 1800);
          showToast('提示词已复制到剪贴板');
        });
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        popoverCopy.classList.add('copied');
        const orig = popoverCopy.innerHTML;
        popoverCopy.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8L6.5 11.5L13 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> 已复制';
        setTimeout(() => {
          popoverCopy.classList.remove('copied');
          popoverCopy.innerHTML = orig;
        }, 1800);
        showToast('提示词已复制到剪贴板');
      }
    });
  </script>
</body>
