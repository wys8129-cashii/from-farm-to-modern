<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工业生产百科全书 · 从农业社会到现代化</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper:   #f5f5f5;
      --paper-2: #ececec;
      --ink:     #2d3142;
      --muted:   #4f5d75;
      --soft:    #7a8399;
      --rule:    rgba(45,49,66,0.12);
      --accent:  #eb6c36;
      --accent-tint: rgba(235,108,54,0.08);
      --link:    #2e5aa8;
      --white:   #ffffff;
      --font-sans: 'Geist', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Songti SC', 'Noto Serif SC', serif;
      --font-mono: 'Geist Mono', 'PingFang SC', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      padding: 3rem 2rem 6rem;
    }

    .frame { max-width: 1080px; margin: 0 auto; }

    /* --- Header --- */
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.75rem, 3vw + 0.5rem, 2.5rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 2.5rem;
      max-width: 640px;
      line-height: 1.5;
    }

    /* --- Layer Stack SVG --- */
    .stack-svg { width: 100%; min-width: 700px; display: block; margin-bottom: 3rem; }

    /* --- Section --- */
    .layer-section {
      margin-bottom: 1.5rem;
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 8px;
      overflow: hidden;
    }

    .layer-section.focal {
      border-color: var(--accent);
      border-width: 1px;
    }

    .layer-header {
      display: flex;
      align-items: center;
      padding: 1rem 1.5rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .layer-header:hover { background: rgba(45,49,66,0.02); }

    .layer-tag {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--muted);
      width: 32px;
      flex-shrink: 0;
    }

    .focal .layer-tag { color: var(--accent); }

    .layer-name {
      font-family: var(--font-sans);
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--ink);
      flex-shrink: 0;
      width: 160px;
    }

    .layer-desc {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--soft);
      letter-spacing: 0.04em;
      flex: 1;
      text-align: right;
      padding-right: 1rem;
    }

    .layer-toggle {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.2s;
    }

    .layer-section.open .layer-toggle { transform: rotate(90deg); }

    .layer-toggle svg { width: 14px; height: 14px; }

    /* --- Layer Body --- */
    .layer-body {
      display: none;
      padding: 0 1.5rem 1.5rem;
      border-top: 1px solid var(--rule);
    }

    .layer-section.open .layer-body { display: block; }

    .category-group { margin-top: 1.25rem; }

    .category-title {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--soft);
      margin-bottom: 0.6rem;
    }

    .chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* --- Chip --- */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }

    .chip:hover {
      background: var(--accent-tint);
      border-color: var(--accent);
      color: var(--accent);
    }

    .chip:active { transform: scale(0.96); }

    .chip.copied {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--white);
    }

    .chip-icon {
      width: 12px;
      height: 12px;
      opacity: 0.5;
      flex-shrink: 0;
    }

    .chip:hover .chip-icon { opacity: 0.8; }
    .chip.copied .chip-icon { opacity: 1; }

    /* --- Toast --- */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--ink);
      color: var(--paper);
      padding: 10px 20px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      z-index: 9999;
      box-shadow: 0 4px 20px rgba(45,49,66,0.2);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* --- Footer --- */
    .footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--rule);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--soft);
      letter-spacing: 0.08em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-hint {
      font-family: var(--font-sans);
      font-style: italic;
      font-size: 0.82rem;
      color: var(--muted);
    }

    @media (max-width: 768px) {
      body { padding: 2rem 1rem 4rem; }
      .layer-desc { display: none; }
      .layer-name { width: auto; flex: 1; }
      .stack-svg { min-width: 600px; }
    }
  </style>
</head>

          { title: '信息服务', items: ['云计算平台', '大数据中心', 'AI算力集群', 'CDN内容分发网络', '物联网平台'] },
          { title: '金融科技', items: ['支付清算系统', '数字货币系统', '证券交易系统', '风控引擎', '智能投顾'] },
          { title: '医疗健康', items: ['远程医疗系统', '基因测序仪', '手术机器人', '智能药房', '可穿戴健康设备'] },
          { title: '智慧城市', items: ['智能电网', '智能交通信号系统', '安防监控系统', '智慧水务', '地下管廊系统'] }
        ]
      }
    ];

    const copyIcon = '<svg class="chip-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M3 11V3.5C3 3.224 3.224 3 3.5 3H11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>';
    const checkIcon = '<svg class="chip-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 8L6.5 11.5L13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const chevronIcon = '<svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 3L9 7L5 11" stroke="#4f5d75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    // Build layer sections
    const container = document.getElementById('layers-container');
    layersData.forEach((layer, idx) => {
      const section = document.createElement('div');
      section.className = 'layer-section' + (layer.focal ? ' focal' : '') + (idx <= 2 ? ' open' : '');
      section.dataset.layerId = layer.id;

      const header = document.createElement('div');
      header.className = 'layer-header';
      header.innerHTML = `
        <span class="layer-tag">${layer.id}</span>
        <span class="layer-name">${layer.name}</span>
        <span class="layer-desc">${layer.desc}</span>
        <span class="layer-toggle">${chevronIcon}</span>
      `;
      header.addEventListener('click', () => {
        section.classList.toggle('open');
      });

      const body = document.createElement('div');
      body.className = 'layer-body';

      layer.categories.forEach(cat => {
        const group = document.createElement('div');
        group.className = 'category-group';
        group.innerHTML = `<p class="category-title">${cat.title}</p>`;
        const chipGrid = document.createElement('div');
        chipGrid.className = 'chip-grid';
        cat.items.forEach(item => {
          const chip = document.createElement('button');
          chip.className = 'chip';
          chip.innerHTML = `${copyIcon}<span>${item}</span>`;
          chip.addEventListener('click', (e) => {
            e.stopPropagation();
            copyToClipboard(item, chip);
          });
          chipGrid.appendChild(chip);
        });
        group.appendChild(chipGrid);
        body.appendChild(group);
      });

      section.appendChild(header);
      section.appendChild(body);
      container.appendChild(section);
    });

    // Copy to clipboard
    function copyToClipboard(text, chip) {
      const fallback = () => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try { document.execCommand('copy'); } catch(e) {}
        document.body.removeChild(textarea);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(fallback);
      } else {
        fallback();
      }

      // Visual feedback
      const originalHTML = chip.innerHTML;
      chip.classList.add('copied');
      chip.innerHTML = `${checkIcon}<span>${text}</span>`;

      setTimeout(() => {
        chip.classList.remove('copied');
        chip.innerHTML = originalHTML;
      }, 1200);

      // Toast
      showToast(`已复制：${text}`);
    }

    // Toast
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');
    let toastTimer = null;

    function showToast(msg) {
      toastText.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }
  </script>
</body>
</html>
